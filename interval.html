<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<link rel="icon" type="image/png" href="logo_icon.png">
	<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="sidebar" id="sidebar">

    <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>

    <a href="index.html" class="sidebar-logo">
        <img src="logo.png" alt="Made by Wayne">
    </a>

    <a href="index.html" class="sidebar-link">Wayne Technique</a>
    <a href="interval.html" class="sidebar-link">Interval Timer</a>
    <a href="projects.html" class="sidebar-link">Projects</a>
    <a href="store.html" class="sidebar-link">Store</a>
    <a href="about.html" class="sidebar-link">About</a>

</div>


<div class="page-content">
    <h1>Interval Timer</h1>

    <div class="panel">
<button class="collapse-btn" id="toggleInputsBtn" type="button"
        aria-expanded="true" aria-controls="intervalInputs">
    ▼ Hide Intervals
</button>

<div id="intervalInputs">
    <div id="intervalList"></div>
    <button class="add-btn" id="addIntervalBtn" type="button">
        + Add Interval
    </button>
</div>

    </div>

    <div class="panel timer-panel">
        <div class="current-name" id="currentName">Ready</div>

        <div class="main-timer" id="mainTimer">05:00</div>

        <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="stats">
            <div>
                <div class="stat-value" id="totalRuntime">00:00</div>
                <div class="stat-label">Total Runtime</div>
            </div>

            <div>
                <div class="stat-value" id="intervalCount">0</div>
                <div class="stat-label">Intervals Completed</div>
            </div>
        </div>

        <div class="controls">
            <button class="start-btn" id="startBtn" type="button">Start</button>
            <button class="next-btn" id="nextBtn" type="button">Next</button>
            <button class="pause-btn" id="pauseBtn" type="button">Pause / Stop</button>
            <button class="reset-btn" id="resetBtn" type="button">Reset</button>
        </div>

    </div>

</div>

<script>

    function toggleSidebar() {
	document.getElementById("sidebar").classList.toggle("collapsed");
    }

(() => {
    const intervalList = document.getElementById("intervalList");
    const addIntervalBtn = document.getElementById("addIntervalBtn");

    const currentName = document.getElementById("currentName");
    const mainTimer = document.getElementById("mainTimer");
    const totalRuntime = document.getElementById("totalRuntime");
    const intervalCount = document.getElementById("intervalCount");
    const progressBar = document.getElementById("progressBar");

    const startBtn = document.getElementById("startBtn");
    const nextBtn = document.getElementById("nextBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    const resetBtn = document.getElementById("resetBtn");

    const beepSound = new Audio("beep1.mp3");
    beepSound.preload = "auto";

    let intervals = [
        { name: "Active", seconds: 60 },
        { name: "Rest", seconds: 150 }
    ];

    let currentIndex = 0;
    let remaining = intervals[0].seconds;
    let totalElapsed = 0;
    let completedIntervals = 0;

    let running = false;
    let lastTimestamp = null;
    let animationFrame = null;

    const toggleInputsBtn = document.getElementById("toggleInputsBtn");
    const intervalInputs = document.getElementById("intervalInputs");

    toggleInputsBtn.addEventListener("click", () => {
    const isExpanded = toggleInputsBtn.getAttribute("aria-expanded") === "true";

    intervalInputs.hidden = isExpanded;
    toggleInputsBtn.setAttribute("aria-expanded", String(!isExpanded));
    toggleInputsBtn.textContent = isExpanded
        ? "▶ Show Intervals"
        : "▼ Hide Intervals";
});

    function formatTime(seconds, showHours = false) {
        seconds = Math.max(0, seconds);

        const wholeSeconds = Math.floor(seconds);
        const hours = Math.floor(wholeSeconds / 3600);
        const minutes = Math.floor((wholeSeconds % 3600) / 60);
        const secs = wholeSeconds % 60;

        if (showHours || hours > 0) {
            return (
                String(hours).padStart(2, "0") + ":" +
                String(minutes).padStart(2, "0") + ":" +
                String(secs).padStart(2, "0")
            );
        }

        return (
            String(minutes).padStart(2, "0") + ":" +
            String(secs).padStart(2, "0")
        );
    }

    function formatInputValue(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
    }

    function parseDuration(value) {
        value = value.trim();

        if (!value) return 0;

        // Accept MM:SS or HH:MM:SS
        if (value.includes(":")) {
            const parts = value.split(":").map(Number);

            if (parts.some(Number.isNaN)) return 0;

            if (parts.length === 2) {
                return Math.max(0, parts[0] * 60 + parts[1]);
            }

            if (parts.length === 3) {
                return Math.max(0, parts[0] * 3600 + parts[1] * 60 + parts[2]);
            }

            return 0;
        }

        // A plain number is treated as seconds.
        const seconds = Number(value);
        return Number.isFinite(seconds) ? Math.max(0, seconds) : 0;
    }

    function renderIntervalInputs() {
        intervalList.innerHTML = "";

        intervals.forEach((interval, index) => {
            const row = document.createElement("div");
            row.className = "interval-row";

            const nameDiv = document.createElement("div");
            const nameLabel = document.createElement("label");
            nameLabel.textContent = `Interval ${index + 1} Name`;

            const nameInput = document.createElement("input");
            nameInput.type = "text";
            nameInput.value = interval.name;
            nameInput.placeholder = "e.g. Jog, Pushups, Rest";
            nameInput.dataset.index = index;
            nameInput.dataset.type = "name";

            nameDiv.appendChild(nameLabel);
            nameDiv.appendChild(nameInput);

            const durationDiv = document.createElement("div");
            const durationLabel = document.createElement("label");
            durationLabel.textContent = "Time";

            const durationInput = document.createElement("input");
            durationInput.type = "text";
            durationInput.inputMode = "numeric";
            durationInput.value = formatInputValue(interval.seconds);
            durationInput.placeholder = "MM:SS";
            durationInput.dataset.index = index;
            durationInput.dataset.type = "duration";

            durationDiv.appendChild(durationLabel);
            durationDiv.appendChild(durationInput);

            const removeBtn = document.createElement("button");
            removeBtn.className = "remove-btn";
            removeBtn.type = "button";
            removeBtn.textContent = "×";
            removeBtn.title = "Remove interval";
            removeBtn.dataset.index = index;

            row.appendChild(nameDiv);
            row.appendChild(durationDiv);
            row.appendChild(removeBtn);

            intervalList.appendChild(row);
        });
    }

    function readIntervalInputs() {
        const rows = intervalList.querySelectorAll(".interval-row");

        rows.forEach((row, index) => {
            const nameInput = row.querySelector('[data-type="name"]');
            const durationInput = row.querySelector('[data-type="duration"]');

            intervals[index].name = nameInput.value.trim() || `Interval ${index + 1}`;
            intervals[index].seconds = parseDuration(durationInput.value);
        });
    }

    function updateDisplay() {
        if (!intervals.length) {
            currentName.textContent = "No intervals";
            mainTimer.textContent = "00:00";
            position.textContent = "Add an interval to begin";
            progressBar.style.width = "0%";
            return;
        }

        const current = intervals[currentIndex];

        currentName.textContent = current.name;
        mainTimer.textContent = formatTime(remaining);
        totalRuntime.textContent = formatTime(totalElapsed, true);
        intervalCount.textContent = completedIntervals;

        const duration = Math.max(1, current.seconds);
        const percent = Math.max(0, Math.min(100, (remaining / duration) * 100));
        progressBar.style.width = percent + "%";

        startBtn.textContent = running ? "Running..." : (totalElapsed > 0 ? "Resume" : "Start");
        startBtn.disabled = running;
    }

    function resetTimerState() {
        stopAnimation();

        readIntervalInputs();

        currentIndex = 0;
        remaining = intervals.length ? intervals[0].seconds : 0;
        totalElapsed = 0;
        completedIntervals = 0;
        running = false;
        lastTimestamp = null;

        updateDisplay();
    }

    function stopAnimation() {
        if (animationFrame !== null) {
            cancelAnimationFrame(animationFrame);
            animationFrame = null;
        }
    }

function beep(times = 1) {
    for (let i = 0; i < times; i++) {
        setTimeout(() => {
            beepSound.currentTime = 0;

            beepSound.play().catch(error => {
                console.warn("Unable to play MP3:", error);
            });
        }, i * 250);
    }
}

    function goToNextInterval() {
        if (!intervals.length) return;

        if (currentIndex < intervals.length - 1) {
            completedIntervals++;
            currentIndex++;
            remaining = intervals[currentIndex].seconds;
            beep(1);
        } else {
            // The final interval has finished.
            completedIntervals++;
            running = false;
            stopAnimation();
            remaining = 0;
            lastTimestamp = null;
            beep(3);
        }

        updateDisplay();
    }

    function finishCurrentInterval() {
        if (currentIndex < intervals.length - 1) {
            completedIntervals++;
            currentIndex++;
            remaining = intervals[currentIndex].seconds;
            beep(1);
        } else {
            completedIntervals++;
            remaining = 0;
            running = false;
            stopAnimation();
            lastTimestamp = null;
            beep(3);
        }
    }

    function tick(timestamp) {
        if (!running) return;

        if (lastTimestamp === null) {
            lastTimestamp = timestamp;
        }

        const delta = (timestamp - lastTimestamp) / 1000;
        lastTimestamp = timestamp;

        totalElapsed += delta;
        remaining -= delta;

        while (remaining <= 0 && running) {
            const overflow = -remaining;

            if (currentIndex < intervals.length - 1) {
                completedIntervals++;
                currentIndex++;
                beep(1);

                remaining = intervals[currentIndex].seconds - overflow;

                // Prevent a zero-length interval from getting stuck.
                if (intervals[currentIndex].seconds <= 0) {
                    remaining = -overflow;
                    continue;
                }
            } else {
                completedIntervals++;
                beep(3);

                // Automatically start the interval sequence over.
                currentIndex = 0;
                remaining = intervals[0].seconds;

                // Keep the total runtime and completed-interval count running
                // so they represent the entire continuous session.
                if (intervals[0].seconds <= 0) {
                    running = false;
                    remaining = 0;
                    break;
                }
            }
        }

        updateDisplay();

        if (running) {
            animationFrame = requestAnimationFrame(tick);
        } else {
            animationFrame = null;
        }
    }

    function startTimer() {
        if (!intervals.length || running) return;

        readIntervalInputs();

        // Keep the currently selected interval in sync with edited inputs.
        if (remaining <= 0) {
            remaining = intervals[currentIndex].seconds;
        }

        if (intervals[currentIndex].seconds <= 0) {
            alert("Please give the current interval a duration greater than zero.");
            return;
        }

        // If the user changed a duration while paused, use the new value.
        if (totalElapsed === 0 && currentIndex === 0) {
            remaining = intervals[0].seconds;
        }

        running = true;
        lastTimestamp = null;
        beep(1);

        animationFrame = requestAnimationFrame(tick);
        updateDisplay();
    }

    function pauseTimer() {
        running = false;
        stopAnimation();
        lastTimestamp = null;
        updateDisplay();
    }

    function nextTimer() {
        if (!intervals.length) return;

        readIntervalInputs();

        if (currentIndex < intervals.length - 1) {
            completedIntervals++;
            currentIndex++;
            remaining = intervals[currentIndex].seconds;
            beep(1);
        } else {
            // Next on the last interval loops directly back to the first.
            completedIntervals++;
            currentIndex = 0;
            remaining = intervals[0].seconds;
            beep(1);

            // If the timer was already running, keep it running.
            // If it was paused, it remains paused.
        }

        updateDisplay();
    }

    addIntervalBtn.addEventListener("click", () => {
        readIntervalInputs();

        intervals.push({
            name: `Interval ${intervals.length + 1}`,
            seconds: 60
        });

        renderIntervalInputs();
        updateDisplay();
    });

    intervalList.addEventListener("click", (event) => {
        const button = event.target.closest(".remove-btn");
        if (!button) return;

        if (intervals.length <= 1) {
            alert("You need at least one interval.");
            return;
        }

        const index = Number(button.dataset.index);

        readIntervalInputs();
        intervals.splice(index, 1);

        if (currentIndex >= intervals.length) {
            currentIndex = intervals.length - 1;
        }

        remaining = intervals[currentIndex].seconds;

        renderIntervalInputs();
        updateDisplay();
    });

    intervalList.addEventListener("change", () => {
        readIntervalInputs();

        if (!running) {
            remaining = intervals[currentIndex].seconds;
            updateDisplay();
        }
    });

    startBtn.addEventListener("click", startTimer);
    pauseBtn.addEventListener("click", pauseTimer);
    nextBtn.addEventListener("click", nextTimer);
    resetBtn.addEventListener("click", resetTimerState);

    // Prevent accidental form-like behavior if this file is later embedded in a form.
    document.addEventListener("keydown", (event) => {
        if (event.code === "Space" &&
            event.target.tagName !== "INPUT" &&
            event.target.tagName !== "TEXTAREA") {
            event.preventDefault();

            if (running) {
                pauseTimer();
            } else {
                startTimer();
            }
        }
    });

    renderIntervalInputs();
    updateDisplay();
})();
</script>

</body>
</html>
