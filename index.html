    <script>
        // =====================================================
        // Variables
        // =====================================================

        let normal = 0;
        let slow = 0;
        let breakCount = 0;
        let last = null;
        let mode = 'paused';

        let breakStartTime = null;
        let breakHistory = [];
        let dailyHistory = [];

        let lastBeepMilestone = 0;
        let thirtyMinuteAlertGiven = false;
        let bankEmptyAlertPlayed = false;

	const beepSound = new Audio("beep1.mp3");
	const tripleBeepSound = new Audio("beep3.mp3");

	beepSound.preload = "auto";
	tripleBeepSound.preload = "auto";

Notification.requestPermission();

function saveState() {

    localStorage.setItem(
        'pomodoroTimerState',
        JSON.stringify({
            normal,
            slow,
            breakCount,
            breakHistory,
            dailyHistory
        })
    );
}

function toggleSidebar() {
	document.getElementById("sidebar").classList.toggle("collapsed");
}

function loadState() {
    const saved =
        localStorage.getItem('pomodoroTimerState');

    if (saved) {

        const state = JSON.parse(saved);

        normal = state.normal || 0;
        slow = state.slow || 0;
        breakCount = state.breakCount || 0;
        breakHistory = state.breakHistory || [];

        document.getElementById('breakCount').textContent =
            breakCount;

	dailyHistory =
    	     state.dailyHistory || [];

        updateBreakHistory();
	updateDailyHistory();
    }
}

function fmt(ms) {

    ms = Math.max(0, ms);

    const sTotal = Math.floor(ms / 1000);
    const h = Math.floor(sTotal / 3600);
    const m = Math.floor((sTotal % 3600) / 60);
    const s = sTotal % 60;

    return (
        String(h).padStart(2, '0') +
        ':' +
        String(m).padStart(2, '0') +
        ':' +
        String(s).padStart(2, '0')
    );
}

function updateProjection() {

    const target = 8 * 60 * 60 * 1000; // 8 hours

    if (normal >= target) {
        document.getElementById('projectedFinish').textContent =
            '8 Hours Reached';
        return;
    }

    const remaining = target - normal;

    const projectedDate = new Date(Date.now() + remaining);

    const timeString = projectedDate.toLocaleTimeString([], {
        hour: '2-digit',
        minute: '2-digit'
    });

    document.getElementById('projectedFinish').textContent =
        'Projected 8-Hour Completion: ' + timeString;
}

function startTimers(){
    last=performance.now();
    mode='running';
}

function pauseTimers(){

    if (mode === 'break') {
	logBreak();
    }

    mode='paused';
    last=null;

    saveState();
}

function resumeMode(){

    logBreak();

    last = performance.now();
    mode = 'running';
}

function breakMode() {

    if (mode !== 'break') {

        breakCount++;

        document.getElementById(
            'breakCount'
        ).textContent = breakCount;

        breakStartTime = Date.now();

        saveState();
    }

    last = performance.now();
    mode = 'break';
}

function playBeep() {

    beepSound.currentTime = 0;
    beepSound.play();
}

function playTripleBeep() {

    tripleBeepSound.currentTime = 0;
    tripleBeepSound.play();
}

    if (slow >= fiveMinutes) {

        normal += fiveMinutes;
    } else {
        normal += slow;

}

    normal += slow;

}

function logBreak() {

    if (breakStartTime === null) return;

    const breakEndTime = Date.now();

    const duration =
        breakEndTime - breakStartTime;

    const startTime =
        new Date(breakStartTime).toLocaleTimeString([], {
            hour: '2-digit',
            minute: '2-digit'
        });

    const endTime =
        new Date(breakEndTime).toLocaleTimeString([], {
            hour: '2-digit',
            minute: '2-digit'
        });

    breakHistory.push({
        number: breakCount,
        start: startTime,
        end: endTime,
        duration: fmt(duration)
    });

    updateBreakHistory();

    saveState();

    breakStartTime = null;
}

function updateBreakHistory() {

    const container =
        document.getElementById("breakHistory");

    if (breakHistory.length === 0) {
        container.innerHTML =
            "No breaks recorded.";
        return;
    }

    container.innerHTML =
        breakHistory
            .map(item =>
                 "Break #" + item.number +
                 " | " + item.start +
                 " - " + item.end +
                 " | " + item.duration
            )
            .join("<br>");
}

function saveDay() {

    const today = new Date().toLocaleDateString();

    const entry = {
        date: today,
        workTime: fmt(normal),
        bankTime: fmt(slow),
        breaks: breakCount
    };

    dailyHistory.push(entry);

    updateDailyHistory();

    resetTimers()

    saveState();
}

function updateDailyHistory() {

    const container =
        document.getElementById("dailyHistory");

    if (dailyHistory.length === 0) {
        container.innerHTML = "No days recorded.";
        return;
    }

    container.innerHTML =
        dailyHistory
            .map(day =>
                day.date +
                " | Work: " + day.workTime +
                " | Breaks: " + day.breaks +
                " | Bank: " + day.bankTime
            )
            .join("<br>");
}

function resetDailyHistory() {

    if (!confirm("Clear all daily history?")) {
        return;
    }

    dailyHistory = [];

    updateDailyHistory();

    saveState();
}

function applyStartingTime() {

	const timeInput =
	document.getElementById('startTime').value;

	if (!timeInput) {

		alert("Please enter a starting time.");
		return;
	}

	const [hours, minutes] = timeInput.split(':').map(Number);

	const now = new Date();

	const start = new Date();
	start.setHours(hours, minutes, 0, 0);

	if (start > now) {
		alert("Starting time cannot be in the future.");
		return;
	}

	const elapsed = now - start;

	normal = elapsed;

	slow = elapsed / 5;

	document.getElementById('t1').textContent = fmt(normal);
	document.getElementById('t2').textContent = fmt(slow);

	bankEmptyAlertPlayed = (slow <= 0);

	lastBeepMilestone = Math.floor(slow / (5 * 60 * 1000));

	last = performance.now();
	mode = 'running';

	saveState();
}

function resetTimers() {

	normal = 0;
	slow = 0;
	breakCount = 0;
	breakHistory = [];
	lastBeepMilestone = 0;
	thirtyMinuteAlertGiven = false;
	bankEmptyAlertPlayed = false;

	mode = 'paused';
	last = null;

	document.getElementById('breakCount').textContent = '0';

	updateBreakHistory();

	localStorage.removeItem('pomodoroTimerState');
}

function showNotifacation(title, message) {

		if (Notification.permission === "granted") {

			new Notifiction(title, {
				body: message,
				icon: "timer_icon.png"
			});
		} 

		else if (Notification.permission !== "denied") {

			Notification.requestPermission();
		}
}

function update(){

	if(last!==null) {

		const now=performance.now();
		const d=now-last;

		if(mode==='running'){

			normal += d;
			slow += d/5;

			if(slow > 0) {

				bankEmptyAlertPlayed = false;
			}
		}

	else if(mode==='break') {

		normal += d;
		slow = Math.max(0, slow - d);

		if(slow <= 0 && !bankEmptyAlertPlayed) {

			bankEmptyAlertPlayed = true;

			slow = 0;

			logBreak();

			playTripleBeep();

			showNotification(
				"Break Bank Empty",
				"Your break bank has been depleted."
			);

			document.title = "⚠️ Break Bank Empty";

			mode = 'paused';
			last = null;
		}
	}

	if(last!==null) {

		last=now;
	}
}

document.getElementById('t1').textContent=fmt(normal);
document.getElementById('t2').textContent=fmt(slow);
const currentMilestone = Math.floor(slow / (5 * 60 * 1000));

if (currentMilestone > lastBeepMilestone && currentMilestone > 0) {

	playBeep();
	lastBeepMilestone = currentMilestone;
}

updateProjection();
}

setInterval(saveState, 5000);
window.addEventListener('beforeunload', saveState);

if ("Notification" in window) {

	Notification.requestPermission();
}

loadState();
updateProjection();
setInterval (update, 250);

</script>
